  <path d="M-10 500 Q90 400 240 510" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  <g transform="translate(100, 400) rotate(-18)">
    <rect x="0" y="0" width="60" height="22" rx="6" fill="#ea580c" stroke="#7c2d12" stroke-width="3"/>
    <circle cx="16" cy="-6" r="5" fill="#1e293b"/>
    <circle cx="32" cy="-8" r="5" fill="#1e293b"/>
    <circle cx="48" cy="-6" r="5" fill="#1e293b"/>
