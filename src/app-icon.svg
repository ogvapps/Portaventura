  <text x="256" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="88" letter-spacing="4" fill="#111827" stroke="#111827" stroke-width="24">POR</text>
  <text x="256" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="88" letter-spacing="4" fill="url(#porGradFav)" stroke="#ffffff" stroke-width="4">POR</text>

