    <linearGradient id="letVFav" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ff8c00"/><stop offset="100%" stop-color="#d95b00"/></linearGradient>
    <linearGradient id="letEFav" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffcc00"/><stop offset="100%" stop-color="#e6a100"/></linearGradient>
