    <circle cx="360" cy="120" r="7" fill="#fbbf24"/>
    <circle cx="385" cy="105" r="8" fill="#38bdf8"/>
    <circle cx="415" cy="115" r="7" fill="#ec4899"/>
    <circle cx="375" cy="145" r="9" fill="#22c55e"/>
