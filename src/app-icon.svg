  <text x="88" y="348" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="url(#letA1Fav)" stroke="#ffffff" stroke-width="3">A</text>
  <text x="135" y="348" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="url(#letVFav)" stroke="#ffffff" stroke-width="3">V</text>
  <text x="184" y="348" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="url(#letEFav)" stroke="#ffffff" stroke-width="3">E</text>
  <text x="230" y="348" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="url(#letNFav)" stroke="#ffffff" stroke-width="3">N</text>
  <text x="284" y="348" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="url(#letTFav)" stroke="#ffffff" stroke-width="3">T</text>
  <text x="330" y="348" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="url(#letUFav)" stroke="#ffffff" stroke-width="3">U</text>
  <text x="382" y="348" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="url(#letRFav)" stroke="#ffffff" stroke-width="3">R</text>
  <text x="430" y="348" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="url(#letA2Fav)" stroke="#ffffff" stroke-width="3">A</text>

