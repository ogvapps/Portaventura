  <!-- Zipline Adventurer -->
  <path d="M120 115 Q256 160 380 95" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(230, 105)">
    <circle cx="25" cy="16" r="6" fill="#64748b" stroke="#0f172a" stroke-width="3"/>
    <line x1="25" y1="20" x2="25" y2="40" stroke="#334155" stroke-width="4"/>
    <circle cx="25" cy="45" r="10" fill="#1e293b"/>
    <path d="M25 52 L16 35 M25 52 L32 34" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
