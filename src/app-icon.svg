    <line x1="125" y1="90" x2="135" y2="280" stroke="#5c3818" stroke-width="8" stroke-linecap="round"/>
    <line x1="65" y1="120" x2="60" y2="280" stroke="#4a2c11" stroke-width="7" stroke-linecap="round"/>
    <rect x="55" y="110" width="85" height="14" rx="3" fill="#8b5a2b" stroke="#3e2723" stroke-width="3"/>
    <rect x="70" y="200" width="70" height="12" rx="3" fill="#8b5a2b" stroke="#3e2723" stroke-width="3"/>
    <polygon points="50,110 95,75 145,110" fill="#6d431d" stroke="#2c1708" stroke-width="4"/>
  </g>

  <!-- Climbing Tower (Right) -->
  <g>
    <polygon points="370,80 430,70 450,260 365,270" fill="#f97316" stroke="#c2410c" stroke-width="4"/>
