    <path d="M19 76 L8 88 L-4 82" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 76 L36 94 L46 98" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
